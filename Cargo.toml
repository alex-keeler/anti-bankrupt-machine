[package]
name = "anti-bankrupt-machine"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
grass = "0.12.4"
argon2 = "0.5.0"
csv = "1.2.2"
regex = "1.9.1"
num-format = "0.4.4"
scraper = "0.17.1"

[dependencies.rocket]
rocket = "=0.5.0-rc.3"
features = ["secrets", "json"]

[dependencies.rocket_dyn_templates]
version = "=0.1.0-rc.3"
features = ["tera"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.sqlx]
version = "0.6"
default-features = false
features = ["macros", "migrate", "mysql", "chrono"]

[dependencies.chrono]
version = "0.4.26"
features = ["serde"]

[dependencies.rocket_db_pools]
version = "=0.1.0-rc.3"
features = ["sqlx_mysql"]
